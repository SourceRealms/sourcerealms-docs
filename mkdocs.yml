site_name: Source Realms Docs
site_url: https://docs.source-realms.com/
site_description: Player wiki for the Source Realms Nations SMP — nations, claims, diplomacy, war, skills, and the gold economy.

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: purple
  font:
    text: Inter
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
    - toc.integrate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Server Info:
      - Server Rules: server-rules.md
      - Getting Started: getting-started.md
      - World Rules: world-rules.md
      - Web Map: web-map.md
      - Voting: voting.md
  - Nations:
      - Creating & Joining: nations/creating-joining.md
      - Roles & Permissions: nations/roles-permissions.md
      - Claims & Territory: nations/claims-territory.md
      - Capital: nations/capital.md
      - Identity & Cosmetics: nations/identity-cosmetics.md
      - Library & Letters: letters.md
  - Diplomacy & War:
      - Diplomacy: diplomacy.md
      - Neutrality: war/neutrality.md
      - Declaring War: war/overview.md
      - Allies & Call to Arms: war/allies.md
  - Economy:
      - Gold Currency: economy/gold.md
      - Nation Bank: economy/bank.md
      - Tax & Upkeep: economy/tax-upkeep.md
      - Foreign Aid: economy/aid.md
      - Community Chest: economy/community-chest.md
  - Player Systems:
      - Roleplay Features: roleplay-features.md
      - Random Teleport: rtp.md
      - Skills & Progression: skills.md
      - Bounties: bounties.md
  - Reference:
      - Command Reference: reference/commands.md
      - Permissions Reference: reference/permissions.md
      - FAQ: faq.md
